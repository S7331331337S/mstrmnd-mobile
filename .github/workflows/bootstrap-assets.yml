name: Bootstrap assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-assets.yml"

jobs:
  import:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Import icons from mstrmnd-core
        run: |
          set -euo pipefail
          mkdir -p assets/images
          BASE="https://raw.githubusercontent.com/S7331331337S/mstrmnd-core/cursor/mstrmnd-mobile-app-e319/apps/mobile/assets/images"
          for f in android-icon-background.png android-icon-foreground.png android-icon-monochrome.png favicon.png icon.png splash-icon.png; do
            echo "fetch $f"
            curl -fsSL -o "assets/images/$f" "$BASE/$f"
            python3 - <<PY
          import pathlib
          p = pathlib.Path("assets/images/$f")
          data = p.read_bytes()
          if data[:8] != bytes.fromhex("89504e470d0a1a0a"):
              raise SystemExit(f"{p} is not a PNG ({data[:8]!r})")
          print(f"{p}: {len(data)} bytes, valid PNG")
          PY
          done

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate pnpm lockfile
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Commit imported assets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: add app icons, splash assets, and pnpm lockfile"
          git push
